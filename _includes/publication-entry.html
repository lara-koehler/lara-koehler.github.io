<article class="publication-entry">
  <p class="publication-title">{{ pub.title }}</p>
  <p class="publication-meta">{{ pub.authors }} — <em>{{ pub.venue }}</em>, {{ pub.year }}</p>

  {% if pub.links %}
  <p class="publication-links">
    {% for link in pub.links %}<a href="{{ link.url }}" target="_blank" rel="noopener">{{ link.label }}</a>{% unless forloop.last %} · {% endunless %}{% endfor %}
  </p>
  {% endif %}
</article>
